[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-train"
version = "0.1.0"
description = "Comprehensive CLI for ML model fine-tuning with XML pattern synthesis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Model Train Team", email = "team@modeltrain.dev"}
]
keywords = [
    "machine-learning",
    "fine-tuning",
    "llm",
    "training",
    "cli",
    "xml-patterns",
    "synthetic-data",
    "lora",
    "unsloth",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
]
ml = [
    "transformers>=4.37.0",
    "torch>=2.1.2",
    "accelerate>=0.26.1",
    "bitsandbytes>=0.42.0",
    "datasets>=2.16.1",
    "trl>=0.7.10",
]
ai-providers = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "httpx>=0.26.0",
]
dev = [
    "pytest>=7.4.4",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.0.0",
]
full = [
    "model-train[backend,ml,ai-providers]",
]

[project.urls]
Homepage = "https://github.com/yourusername/model-train"
Documentation = "https://github.com/yourusername/model-train/wiki"
Repository = "https://github.com/yourusername/model-train"
"Bug Reports" = "https://github.com/yourusername/model-train/issues"

[project.scripts]
model-train = "cli.main:main"

[tool.setuptools]
packages = ["cli", "backend", "core"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
